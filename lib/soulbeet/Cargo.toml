[package]
name = "soulbeet"
version = "1.0.0-alpha-0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "rt", "macros", "fs"] }
reqwest = { version = "0.12.25", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.41"
env_logger = "0.11.8"
regex = "1"
thiserror = "2.0.16"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1"
itertools = "0.14.0"
musicbrainz_rs = { git = "https://github.com/RustyNova016/musicbrainz_rs", rev = "44c25c88bc776309b59a7a9d71d91b59aaa44781" }
shared = { workspace = true }
futures = "0.3.31"
governor = "0.10.1"
md5 = "0.7"
rand = "0.9"
sha2 = "0.10"
libc = "0.2.175"
# Pinned: writes the tags beets reads, which a minor release may change.
lofty = "=0.25.5"
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
