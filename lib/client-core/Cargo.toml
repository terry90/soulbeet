[package]
name = "client-core"
version = "0.1.0"
edition = "2021"
description = "Offline-first local mirror, cache manager, mutation outbox, FTS5 search, Android Auto browse engine, and Connect WS client for Soulbeet Desktop & Android."

[lib]
name = "client_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
shared = { workspace = true }
uniffi = { version = "0.29", features = ["tokio"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "migrate",
] }
reqwest = { version = "0.12.25", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
tokio = { version = "1.48.0", features = [
  "rt-multi-thread",
  "fs",
  "sync",
  "time",
  "macros",
  "io-util",
] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0.16"
tracing = "0.1.41"
url = "2"
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[dev-dependencies]
axum = { version = "0.8.7", features = ["ws"] }
tempfile = "3.22.0"
