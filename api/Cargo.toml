[package]
name = "api"
version = "0.10.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
soulbeet = { workspace = true, optional = true }
shared = { workspace = true }
chrono = { version = "0.4.42", features = ["serde", "wasm-bindgen"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1"
tower-cookies = { version = "0.11.0", optional = true }
jsonwebtoken = { version = "10.2.0", features = [
  "rust_crypto",
], optional = true }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "macros",
  "migrate",
  "uuid",
], optional = true }
argon2 = { version = "0.5.3", optional = true }
uuid = { version = "1.19.0", features = ["v4", "serde"], optional = true }
rand = { version = "0.9.2", optional = true }
tokio = { version = "1.48.0", features = [
  "rt-multi-thread",
  "rt",
  "fs",
  "sync",
  "macros",
  "time",
  "net",
], optional = true }
tracing = "0.1.41"
axum = { version = "0.8.7", optional = true }
aes-gcm = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12.1", optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
url = { version = "2.5.8", optional = true }
reqwest = { version = "0.12.25", features = ["json"], optional = true }
rustix = { version = "1.1.2", features = ["fs"], optional = true }
rmcp = { version = "=3.10.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
], optional = true }

[build-dependencies]
dotenvy = "0.15.7"

[dev-dependencies]
async-trait = "0.1"
md5 = "0.7"
rmcp = { version = "=3.10.0", default-features = false, features = [
  "client",
  "auth",
  "transport-streamable-http-client-reqwest",
] }
reqwest_013 = { package = "reqwest", version = "0.13.2", default-features = false }
tempfile = "3"
tokio = { version = "1.48.0", features = ["test-util"] }
tower = { version = "0.5.2", features = ["util"] }

[features]
default = []
server = [
  "dep:soulbeet",
  "dep:sqlx",
  "dep:tokio",
  "dep:uuid",
  "dep:argon2",
  "dep:rand",
  "dep:jsonwebtoken",
  "dep:tower-cookies",
  "dep:axum",
  "dep:aes-gcm",
  "dep:sha2",
  "dep:hmac",
  "dep:base64",
  "dep:futures",
  "dep:async-trait",
  "dep:url",
  "dep:reqwest",
  "dep:rustix",
  "dep:rmcp",
]
