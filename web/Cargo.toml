[package]
name = "web"
version = "0.10.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
api = { workspace = true }
shared = { workspace = true }
futures = "0.3.32"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.91", features = [
    "Storage",
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaError",
    "EventTarget",
    "Event",
    "KeyboardEvent",
    "Response",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-timers = { version = "0.3.0", features = ["futures"] }
chrono = { version = "0.4.44", features = ["serde", "wasm-bindgen"] }
tower-cookies = { version = "0.11.0", optional = true }
axum = { version = "0.8.8", optional = true }
tower-http = { version = "0.6.8", features = ["compression-gzip"], optional = true }

[dev-dependencies]
flate2 = "1.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.2", features = ["util"] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "ui/server", "dep:tower-cookies", "dep:axum", "dep:tower-http"]
