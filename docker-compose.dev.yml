# Build-from-source Docker Compose stack for local development.
# Run with: docker compose -f docker-compose.dev.yml up --build
# For ready-to-run production deployments with prebuilt images, use compose.yaml.

services:
  soulbeet:
    build: .
    container_name: soulbeet
    restart: unless-stopped
    ports:
      - 9765:9765
    environment:
      - DATABASE_URL=sqlite:/data/soulbeet.db
      # This path must match the volume mapping for downloads inside the container
      - DOWNLOAD_PATH=/downloads
      # Optional. Unset, a key is generated on the first start and stored in
      # /data/secret.key next to the database: back it up with the database.
      # To set your own, put SECRET_KEY in a .env file next to this one
      # (at least 32 random bytes, for example openssl rand -hex 32).
      # Passed on only when it is set.
      - SECRET_KEY
      # Your Navidrome server URL (set ND_MUSICFOLDER=/music/_default on Navidrome
      # so per-user hardlinked libraries under /music/<username> do not duplicate).
      - NAVIDROME_URL=http://localhost:4533
      # - BEETS_CONFIG=/config/config.yaml # Needs the ./beets:/config volume below
    volumes:
      # Soulbeet's database, secret.key and the beets library databases. Keep it
      # on a local disk: SQLite cannot lock files on most network shares.
      - soulbeet_data:/data
      # Map the download folder.
      # IMPORTANT: This must be the SAME physical folder that slskd writes to.
      - /path/to/your/downloads:/downloads
      # Map your music libraries where beets will move files
      - /path/to/your/music:/music
      # Custom beets config. BEETS_CONFIG replaces the shipped /app/beets_config.yaml,
      # so start from a copy of it (see README). Leave commented to use the shipped one.
      # - ./beets:/config
      # Drop-in pure-Python beets plugins (see docs/beets-plugins.md):
      # - ./my-plugins:/data/beets-plugins:ro
      # depends_on:
      #   - slskd
      # Optional: Slskd service if you want to run it together
      # If you already have slskd running elsewhere, ensure Soulbeet can reach it via network
      # slskd:
      #   image: slskd/slskd
      #   container_name: slskd
      #   environment:
      #     - SLSKD_REMOTE_CONFIGURATION=true
      #     - SLSKD_SLSK_USERNAME=xxx
      #     - SLSKD_SLSK_PASSWORD=xxx
      #   volumes:
      #     - /path/to/your/slskd_data:/app
      #     - /path/to/your/downloads:/app/downloads
      #   ports:
      #     - "5030:5030"
      #   restart: unless-stopped
      # Optional: an AirDC++ Web Client for the Direct Connect download source, off until an
      # admin turns it on (docs/direct-connect.md). Soulbeet reaches it at http://airdcpp:5600.
      # airdcpp:
      #   image: gangefors/airdcpp-webclient:2.14.0
      #   container_name: airdcpp
      #   environment:
      #     # Soulbeet's user and group, so beets can move what AirDC++ saves.
      #     - PUID=1000
      #     - PGID=1000
      #     - UMASK=0022
      #   volumes:
      #     - /path/to/your/airdcpp_data:/.airdcpp
      #     # IMPORTANT: the SAME physical folder as Soulbeet's /downloads.
      #     - /path/to/your/downloads:/Downloads
      #     # Mount nothing under /Share: AirDC++ shares every folder there with the hubs.
      #   # Its web UI, for setting it up from this machine only. Never publish 5600 to the internet.
      #   ports:
      #     - "127.0.0.1:5600:5600"
      #   restart: unless-stopped

volumes:
  soulbeet_data:
