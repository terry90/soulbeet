[package]
name = "ui"
version = "1.0.0-alpha-1"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
api = { workspace = true }
shared = { workspace = true }
web-sys = { version = "0.3.91", features = ["Storage", "Window", "Location"] }
serde_json = "1.0.149"
futures = "0.3.32"
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-bindgen = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48.0", features = ["time", "rt"] }

[dev-dependencies]
dioxus-ssr = "0.7.4"
# Builds click events for component tests.
dioxus-html = { version = "0.7.4", features = ["serialize"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
server = ["api/server"]
