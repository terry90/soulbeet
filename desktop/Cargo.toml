[package]
name = "desktop"
version = "1.0.0-alpha-1"
edition = "2021"
description = "Soulbeet Refined Midnight Studio native desktop player for Linux and Windows (dioxus-desktop + libmpv + souvlaki + in-process client-core)."

[dependencies]
dioxus = { workspace = true, features = ["desktop", "router"] }
dioxus-desktop = "0.7.4"
ui = { workspace = true }
shared = { workspace = true }
client-core = { workspace = true }
libmpv2 = { version = "7.0.1", default-features = false }
souvlaki = "0.9.3"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls"] }
directories = "6.0.0"
uuid = { version = "1.19.0", features = ["v4"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3.22.0"

[features]
default = ["desktop"]
desktop = []
