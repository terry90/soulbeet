# E2E stack: the production soulbeet image wired to a fake slskd, a fake
# MusicBrainz, a fake archive.org, fake yt-dlp and ytmusicapi packages, a fake GD Studio and a real Navidrome. Downloads and the music library are
# bind-mounted so the specs can assert on delivered and imported files.
#
# Build the app image first (from the repo root):
#   docker build -t soulbeet:e2e --build-arg TIER=light .
# Generate fixtures before starting (from e2e/); this also creates the
# bind-mounted directories:
#   E2E_MB_HOST=stubs:5050 npm run fixtures

services:
  soulbeet:
    image: ${SOULBEET_IMAGE:-soulbeet:e2e}
    ports:
      - "9765:9765"
    environment:
      - DATABASE_URL=sqlite:/data/soulbeet.db
      - SECRET_KEY=e2e-secret-key-0123456789abcdefghijklmnop
      - REGISTRATION=open
      - DOWNLOAD_PATH=/downloads
      - BEETS_CONFIG=/app/beets-e2e.yaml
      - MUSICBRAINZ_HOST=stubs:5050
      - LISTENBRAINZ_HOST=stubs:5060
      - LISTENBRAINZ_LABS_HOST=stubs:5061
      - DEEZER_HOST=stubs:5062
      - ARCHIVE_HOST=stubs:5064
      - GDSTUDIO_HOST=stubs:5063
      - NAVIDROME_URL=http://navidrome:4533
      - OIDC_ISSUER_URL=http://stubs:5070
      - OIDC_CLIENT_ID=soulbeet-e2e
      - OIDC_CLIENT_SECRET=e2e-oidc-secret
      - OIDC_PROVIDER_NAME=Stub ID
    volumes:
      - ./.runtime/downloads:/downloads
      - ./.runtime/music:/music
      # The beets library databases, which the specs read on the host.
      - ./.runtime/data/beets-libraries:/data/beets-libraries
      - ./.fixtures/beets-e2e.yaml:/app/beets-e2e.yaml:ro
      # Where the :full image has the YouTube Music helper's packages: fakes that answer from
      # the catalogue fixtures/generate.ts writes beside them, and stand-ins for deno and
      # ffmpeg, which the light image lacks.
      - ./.fixtures/ytdlp-site-packages:/opt/ytdlp/lib/python3.11/site-packages:ro
      - ./fixtures/ytdlp-bin/deno:/opt/ytdlp/bin/deno:ro
      - ./fixtures/ytdlp-bin/ffmpeg:/usr/local/bin/ffmpeg:ro
    depends_on:
      - stubs
      - navidrome

  # A second instance with the beets config from issue #90 (no metadata
  # source). Its config directory is mounted, not the file, so a spec can
  # replace the file on the host and the instance sees the new one.
  soulbeet-user90:
    image: ${SOULBEET_IMAGE:-soulbeet:e2e}
    ports:
      - "9766:9765"
    environment:
      - DATABASE_URL=sqlite:/data/soulbeet.db
      - SECRET_KEY=e2e-secret-key-0123456789abcdefghijklmnop
      - REGISTRATION=open
      - DOWNLOAD_PATH=/downloads
      - BEETS_CONFIG=/config/config.yaml
      - MUSICBRAINZ_HOST=stubs:5050
      - LISTENBRAINZ_HOST=stubs:5060
      - LISTENBRAINZ_LABS_HOST=stubs:5061
      - DEEZER_HOST=stubs:5062
      - ARCHIVE_HOST=stubs:5064
      - GDSTUDIO_HOST=stubs:5063
    volumes:
      - ./.runtime/downloads:/downloads
      - ./.runtime/music-user90:/music
      - ./.runtime/user90-config:/config:ro
    depends_on:
      - stubs

  stubs:
    build:
      context: .
      dockerfile: stubs/Dockerfile
    ports:
      - "5030:5030"
      - "5050:5050"
      # The GD Studio double's /_control, which gdstudio.spec.ts sets and reads.
      - "5063:5063"
      - "5070:5070"
    environment:
      - SLSKD_API_KEY=e2e-slskd-api-key
      - OIDC_ISSUER=http://stubs:5070
      - OIDC_BROWSER_URL=http://127.0.0.1:5070
    volumes:
      - ./.fixtures/audio:/e2e/.fixtures/audio:ro
      - ./.runtime/downloads:/downloads

  navidrome:
    image: deluan/navidrome:0.64.2
    ports:
      - "4533:4533"
    environment:
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_SCANSCHEDULE=15s
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_DEVAUTOCREATEADMINPASSWORD=e2e-navidrome-admin
      - ND_SUBSONIC_DEFAULTREPORTREALPATH=true
    volumes:
      - ./.runtime/music:/music:ro
      - ./.runtime/navidrome:/data
