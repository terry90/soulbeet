name: End-to-End Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            compose: -f compose.e2e.yml
            services: ""
            ports: "9765 9766"
            deps: ""
            run: npx playwright test
          - suite: mcp
            compose: -f compose.e2e.yml -f compose.mcp.yml
            services: stubs navidrome soulbeet-mcp
            ports: "9767"
            # The stubs (slskd, MusicBrainz, the Navidrome proxy) and Navidrome, which the
            # contracts and setup-mcp projects reach before the app.
            deps: "5030 5050 4534 4533"
            run: npx playwright test -c playwright.mcp.config.ts
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: soulbeet:e2e
          build-args: |
            TIER=light
          # Reuse the layer cache from the image publishing workflow. Its
          # light/amd64 build matches this one up to the app build, which
          # it runs with a BUILD_ID build arg this one does not pass, so the
          # app build and the layers after it are built here.
          cache-from: |
            type=gha,scope=Build and Push Docker Image-linux/amd64-light
            type=gha,scope=Build and Push Docker Image-linux/amd64-rust
            type=gha,scope=e2e
          # Only the main leg writes the cache, so the two legs never race
          # on one scope.
          cache-to: ${{ matrix.suite == 'main' && 'type=gha,mode=max,scope=e2e' || '' }}

      - name: Probe the shipped beets config
        if: matrix.suite == 'main'
        shell: bash
        run: |
          set -euo pipefail
          script=$(cat "$GITHUB_WORKSPACE/lib/soulbeet/src/beets/probe.py")
          [ -n "$script" ] || { echo "FAIL: probe.py is empty or missing"; exit 1; }
          probe=$(docker run --rm --entrypoint=/usr/bin/python3 soulbeet:e2e \
            -P -c "$script" /app/beets_config.yaml)
          echo "$probe"
          jq -e '.fatal == null and (.plugin_errors | length) == 0 and .import_hook
                 and ([.metadata_sources[] | select(. != "Acoustid")] | length) > 0' \
            <<<"$probe" >/dev/null \
            || { echo "FAIL: shipped beets config does not probe clean"; exit 1; }
          docker run --rm --entrypoint=/tini soulbeet:e2e --version

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate fixtures
        run: E2E_MB_HOST=stubs:5050 npm run fixtures

      - name: Start the stack
        run: docker compose ${{ matrix.compose }} up -d --build${{ matrix.services != '' && format(' {0}', matrix.services) || '' }}

      - name: Wait for the apps
        run: |
          for port in ${{ matrix.deps }}; do
            timeout 120 bash -c "until (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 2; done"
          done
          for port in ${{ matrix.ports }}; do
            timeout 120 bash -c "until curl -fso /dev/null --max-time 2 http://127.0.0.1:$port/; do sleep 2; done"
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        env:
          CI: "true"
          E2E_SLSKD_URL: http://stubs:5030
          E2E_MUSIC_DIR: /music
          E2E_NAVIDROME: "1"
          E2E_USER90_BASE_URL: http://127.0.0.1:9766
          E2E_MCP_COMPOSE: ${{ matrix.suite == 'mcp' && format('docker compose {0}', matrix.compose) || '' }}
        run: ${{ matrix.run }}

      - name: Collect stack logs
        if: failure()
        run: docker compose ${{ matrix.compose }} logs --no-color > stack.log 2>&1 || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose ${{ matrix.compose }} down -v || true
