name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:
  # The image workflow runs these before it pushes anything.
  workflow_call:
    inputs:
      ref:
        description: "Git reference to test"
        required: false
        type: string

concurrency:
  # A called run gets its caller's github context, so the workflow name keeps
  # it from cancelling this workflow's own run for the same push, or being
  # cancelled by it.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # One soulbeet test runs the real probe.py with python3.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same version as the Dockerfile builder image.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@v2

      - name: Test the workspace
        run: cargo test --workspace --features server,dioxus/server --lib --locked

      # The routes live in the web binary, which --lib leaves out.
      - name: Test the web routes
        run: cargo test -p web --features server,dioxus/server --bins --locked

      # Without feature unification from the other crates, to catch missing features.
      - name: Test soulbeet on its own
        run: cargo test -p soulbeet --lib --locked

  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # The image interpreter is 3.11, and probe.py and import.py need -P (3.11+).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install beets and pytest
        run: python -m pip install -c build/requirements-beets.txt "beets[chroma,discogs]" requests musicbrainzngs pytest==8.3.5

      - name: Test the beets config probe and import driver
        run: python -m pytest -q lib/soulbeet/tests/probe lib/soulbeet/tests/import

  # The oldest beets the import hook check accepts must run the driver.
  driver-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install beets 2.8.0 and pytest
        run: python -m pip install beets==2.8.0 pytest==8.3.5

      - name: Test the import driver on beets 2.8.0
        run: python -m pytest -q lib/soulbeet/tests/import
